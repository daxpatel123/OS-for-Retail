# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration file
# ─────────────────────────────────────────────────────────────────────────────
[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template used to generate migration file names
# Default: %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for the generated timestamps in migration filenames
# Leave blank to use the local timezone
timezone = UTC

# Maximum length for the slug (human-readable part of the filename)
truncate_slug_length = 40

# sys.path manipulation — useful when running alembic from outside the package
# prepend_sys_path = .

# Version location — supports multiple directories (space-separated)
# version_locations = %(here)s/alembic/versions

# Version path separator on Windows; use "os" to use os.pathsep
# version_path_separator = os

# ─── Database URL ─────────────────────────────────────────────────────────────
# Alembic requires a synchronous DSN.  We read DATABASE_URL_SYNC from the
# environment at runtime via env.py.  The placeholder below is only used when
# running alembic commands in environments where env.py cannot source .env
# automatically (e.g. bare-metal CI without python-dotenv).
#
# In normal operation (Docker or local dev with .env loaded) this value is
# overridden inside alembic/env.py:
#   config.set_main_option("sqlalchemy.url", os.environ["DATABASE_URL_SYNC"])
sqlalchemy.url = postgresql://retailos:retailos_password@localhost:5432/retailos

# ─── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
