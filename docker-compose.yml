version: "3.9"

services:
  # ─── Data stores ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: retailos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retailos
      POSTGRES_PASSWORD: retailos_password
      POSTGRES_DB: retailos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retailos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailos -d retailos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: retailos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - retailos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Application ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailos_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retailos:retailos_password@postgres:5432/retailos
      DATABASE_URL_SYNC: postgresql://retailos:retailos_password@postgres:5432/retailos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retailos_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailos_celery
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retailos:retailos_password@postgres:5432/retailos
      DATABASE_URL_SYNC: postgresql://retailos:retailos_password@postgres:5432/retailos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retailos_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retailos_network

  # ─── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: retailos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - retailos_network

# ─── Named volumes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  retailos_network:
    driver: bridge
